[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
diagwire = { path = "crates/diagwire" }
diagwire-hsfz = { path = "crates/hsfz" }
diagwire-uds = { path = "crates/uds" }
diagwire-ds2 = { path = "crates/ds2" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
